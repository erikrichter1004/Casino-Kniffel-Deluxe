<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101a2a"><title>CABO Online V1</title><link rel="manifest" href="./manifest.webmanifest"><style>body{margin:0;background:#101a2a;color:white;font:16px system-ui;min-height:100vh;display:grid;place-items:center}main{width:min(460px,90vw)}h1{text-align:center;font-size:3rem}button,input{font:inherit;padding:14px;border-radius:12px;border:0}button{background:#8bdcc3;color:#10251d;font-weight:700;cursor:pointer;width:100%;margin:8px 0}input{width:calc(100% - 28px)}section{background:#1e3045;padding:22px;border-radius:18px}label{display:block;margin:12px 0}small{color:#c7d3df}</style></head><body><main><h1>CABO</h1><section id="app"><button onclick="create()">Neue Partie erstellen</button><button onclick="join()">Raum beitreten</button></section><p><small>V1: Technischer Aufbau. Online-Spielbetrieb noch nicht freigegeben.</small></p></main><script>
const app=document.getElementById('app');
function create(){app.innerHTML='<h2>Partie erstellen</h2><label>Dein Name<input id="name" placeholder="Name"></label><label>Startkarten<select id="cards"><option selected>4</option><option>3</option><option>5</option><option>6</option><option>7</option><option>8</option></select></label><label>Letzte Züge nach CABO<select><option selected>1</option><option>0</option><option>2</option><option>3</option></select></label><button onclick="alert(\'Online-Raumverwaltung folgt. Noch kein echter Raum erstellt.\')">Partie vorbereiten</button><button onclick="home()">Zurück</button>'}
function join(){app.innerHTML='<h2>Raum beitreten</h2><label>Dein Name<input placeholder="Name"></label><label>Vierstelliger Raumcode<input inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="0000"></label><button onclick="alert(\'Online-Verbindung ist noch nicht implementiert.\')">Verbinden</button><button onclick="home()">Zurück</button>'}
function home(){location.reload()}
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
