 cardState="drawing";
 const n=drawSequence++;
 const style=drawStyles[n%drawStyles.length];
 playCardDraw(style);
 // Alternating demonstration: normal event reveals immediately; mystery stays face down.
 const mystery=n%2===0;
 pendingDemoEvent=demoEvent();
 actionDraw.classList.remove("card-tapped","single-mystery",...drawStyles);
 void actionDraw.offsetWidth;
 actionDraw.classList.add("is-drawing",style);
 actionCaption.textContent="Karte wird gezogen …";
 actionStatus.textContent="Animationsvorschau · Seltenheit wird gewichtet gezogen";
 window.setTimeout(()=>{
  actionDraw.classList.remove("is-drawing",style);
  if(mystery){
   cardState="pending";
   actionDraw.classList.add("single-mystery");
   actionCaption.textContent="🔒 Mystery-Karte";
   actionDraw.setAttribute("aria-label","Verdeckte Mystery-Karte – Enthüllung nur als Vorschau testen");
   actionStatus.textContent="Erst werten, dann enthüllen · Zum Testen Karte antippen";
  }else{
   cardState="revealed";
   actionCaption.textContent="Karte wird enthüllt …";
   actionStatus.textContent="Normales Ereignis: sofortige Enthüllung · Vorschau";
   startMysteryReveal({event:pendingDemoEvent});
  }
 },1150);
});
draw();
window.addEventListener("resize",()=>moveDroplet(true));
</script></body></html>
